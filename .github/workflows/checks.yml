name: Public research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    name: Public source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Check public structure and navigation
        run: |
          python3 tools/build_navigation.py
          python3 -c "import sys; sys.path.insert(0, 'tools'); import check; check.validate(check.ROOT, native=False); print('PASS: public structure; native and full test phases run on Oracle.')"
      - name: Rebuild canonical website introduction
        run: |
          python3 website/build.py
          git diff --exit-code -- website
